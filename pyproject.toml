[project]
name = "dittofs-ops-mcp"
version = "0.1.0"
description = "MCP server for the DittoFS control-plane API (read-only subset) API"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
]

# Run with `uv run server.py`; this is an application, not an installable package.
[tool.uv]
package = false
